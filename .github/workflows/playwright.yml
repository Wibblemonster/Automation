name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Generate Linux visual baselines (download the artifact and commit the PNGs)
        required: true
        type: boolean
        default: false
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        env:
          NBS_EMAIL: ${{ secrets.NBS_EMAIL }}
          NBS_PASSWORD: ${{ secrets.NBS_PASSWORD }}
        run: |
          if [[ "${{ inputs.update_visual_baselines }}" == "true" ]]; then
            npx playwright test --grep "Visual regression: Dyson manufacturer homepage" --update-snapshots
          else
            npx playwright test
          fi
      - name: Upload generated visual baselines
        if: ${{ always() && inputs.update_visual_baselines }}
        uses: actions/upload-artifact@v4
        with:
          name: dyson-visual-baselines-linux
          path: tests/first.test.spec.ts-snapshots/*.png
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
